<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Orçamento</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f1ea;color:#1f2937}.msg{max-width:560px;margin:40px auto;padding:20px;background:#fff;border-radius:12px;border:1px solid #e5dccb}</style>
</head>
<body>
<div class="msg" id="msg">Carregando orçamento…</div>
<noscript><div class="msg">Abra este link no navegador (Chrome ou Safari) para preencher o orçamento.</div></noscript>
<script type="module">
import { htmlFormularioFornecedor, decodificarPedidoLink } from './js/orcamento-form.js?v=link-1';
try {
  const d = new URLSearchParams(location.hash.slice(1)).get('d');
  if (!d) throw new Error('sem dados');
  const dados = decodificarPedidoLink(d);
  if (!dados || !Array.isArray(dados.itens)) throw new Error('inválido');
  document.open(); document.write(htmlFormularioFornecedor(dados)); document.close();
} catch (_) {
  document.getElementById('msg').textContent = 'Link de orçamento inválido ou incompleto. Peça um novo link a quem enviou.';
}
</script>
</body>
</html>
